# External DFT sources for WC W-vacancy MTP training.
# One entry per line. Lines starting with # are ignored.
#
# Format:  category:kind:path
#   category  - composition bucket (see targets below)
#   kind      - outcar | cfg | dir
#   path      - absolute or project-relative path
#
# Legacy format (no category) is also accepted:  kind:path
#
# --- Target composition (500-2000 structures total) ---
#   bulk       25-30%  perfect/near-perfect alpha-WC (equil, AIMD 300-2500 K,
#                       rattled 0.05-0.3 A, strains +/-5-10%, shear)
#   defect     20-25%  W-vacancy: multiple supercells, unreconstructed starts,
#                       relaxed planar C-C dimer, C-C distance scans
#   high_t     15-20%  AIMD/rattled defect snapshots >1800 K (dimer rotation)
#   close_cc   10-15%  artificially close C-C pairs, under-coordinated C
#   surface    10%      surfaces / near-surface vacancies (dissolution/premelting)
#   pathway    rest     NEB images, short exploratory MTP runs (active learning)
#
# VASP reference settings: PBE, PAW (W_sv + C), ENCUT 450-500 eV,
#   k-spacing ~0.025 A^-1 (or Gamma-only for very large cells if converged).
#
# --- Examples (uncomment and set paths as data become available) ---
#
# bulk:outcar:/slask/mehdin/dynamics/wc/bulk_equil/OUTCAR
# bulk:dir:/slask/mehdin/dynamics/wc/datasets/static/bulk/
# defect:dir:/slask/mehdin/dynamics/wc/datasets/static/defects/
# defect:cfg:/slask/mehdin/dynamics/wc/datasets/static/cc_scan.cfg
# close_cc:dir:/slask/mehdin/dynamics/wc/datasets/static/close_cc/
# surface:dir:/slask/mehdin/dynamics/wc/datasets/static/surfaces/
# pathway:dir:/slask/mehdin/dynamics/wc/datasets/static/neb/